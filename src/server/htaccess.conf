# ==========================================================================
# {{ site.name }} : configuration Apache pour l'hébergement web OVH
# Fichier généré par tools/build.py depuis src/server/htaccess.conf.
# Les blocs <IfModule> évitent une erreur 500 si un module manque.
# ==========================================================================

AddDefaultCharset utf-8
AddType font/woff2 .woff2
Options -Indexes
ErrorDocument 404 /404.html

# Fichiers cachés (.git, .env...) jamais servis.
<FilesMatch "^\.">
  Require all denied
</FilesMatch>

<IfModule mod_rewrite.c>
  RewriteEngine On

  # HTTPS obligatoire (méthode recommandée par OVH : test du port 80).
  # On garde l'adresse demandée : le site reste testable avant la bascule du domaine.
  RewriteCond %{SERVER_PORT} 80
  RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

  # Une seule adresse : sans « www » -> avec « www ».
  RewriteCond %{HTTP_HOST} !^{{@ htaccess_host_regex }}$ [NC]
  RewriteCond %{HTTP_HOST} ^{{@ htaccess_apex_regex }}$ [NC]
  RewriteRule ^(.*)$ https://{{@ htaccess_host }}/$1 [R=301,L]

  # Anciennes adresses du site Wix (référencement et liens déjà partagés).
{{@ htaccess_redirects }}
</IfModule>

<IfModule mod_headers.c>
  # Politique de sécurité : seules les ressources du site lui-même sont autorisées.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Strict-Transport-Security "max-age=31536000"

  # CSS et JS sont versionnés (?v=<empreinte>) à chaque build : cache long sans risque.
  <FilesMatch "\.(css|js|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.(png|jpe?g|webp|avif|svg)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml application/json
</IfModule>
